name: Daily PSX Scout

on:
  schedule:
    # 04:45 UTC = 09:45 PKT (Mon–Fri)
    - cron: "45 4 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Pass --force to scout.py (skip cooldown check)"
        required: false
        default: "false"


jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java (for PDF extraction)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scout
        id: scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS="--auto"
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            ARGS="$ARGS --force"
          fi
          python3 scout.py $ARGS 2>&1 | tee /tmp/scout_output.txt
          # Extract verdict line for email subject
          VERDICT=$(grep -oP '(?<=Verdict: )(SKIP|RUN|URGENT)' /tmp/scout_output.txt || echo "UNKNOWN")
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          # Capture full output for email body
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/scout_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send ntfy notification
        if: always()
        run: |
          VERDICT="${{ steps.scout.outputs.verdict }}"
          case "$VERDICT" in
            URGENT) PRIORITY="urgent" ; TAGS="rotating_light" ;;
            RUN)    PRIORITY="high"   ; TAGS="green_circle" ;;
            *)      PRIORITY="low"    ; TAGS="white_circle" ;;
          esac
          BODY=$(cat /tmp/scout_output.txt 2>/dev/null | head -30 || echo "Scout completed")
          curl -s \
            -H "Title: PSX Scout [$VERDICT]" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS,chart_with_upwards_trend" \
            -d "$BODY" \
            "https://ntfy.sh/psx-account-junaid"

      - name: Send WhatsApp notification
        if: always()
        env:
          OPENWA_API_URL: ${{ secrets.OPENWA_API_URL }}
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          OPENWA_SESSION_ID: ${{ secrets.OPENWA_SESSION_ID }}
          OPENWA_SELF_CHAT_ID: ${{ secrets.OPENWA_SELF_CHAT_ID }}
        run: |
          VERDICT="${{ steps.scout.outputs.verdict }}"
          case "$VERDICT" in
            URGENT) EMOJI="🚨" ;;
            RUN)    EMOJI="✅" ;;
            *)      EMOJI="⚪" ;;
          esac
          SUMMARY=$(grep -E '(🟢|🔴|🟡|⚪)\s+\w+\s+(ENTER|ADD|HOLD|TRIM|EXIT)' /tmp/scout_output.txt 2>/dev/null | sed 's/^ *//')
          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(sed 's/^[[:space:]]*//' /tmp/scout_output.txt 2>/dev/null | grep -v '^$' | grep -v '^===' | tail -20 || echo "Scout completed")
          fi
          RUNINFO="Run: #${{ github.run_number }} | $(date -u '+%Y-%m-%d %H:%M UTC')"
          TEXT=$(printf '%s *PSX Scout [%s]*\n\n%s\n\n_%s_' "$EMOJI" "$VERDICT" "$SUMMARY" "$RUNINFO")
          curl -s -X POST "$OPENWA_API_URL/api/sessions/$OPENWA_SESSION_ID/messages/send-text" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $OPENWA_API_KEY" \
            -d "{\"chatId\": \"$OPENWA_SELF_CHAT_ID\", \"text\": $(printf '%s' "$TEXT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}"

      - name: Upload scout log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-log-${{ github.run_id }}
          path: |
            logs/
            db.sqlite
          retention-days: 30
